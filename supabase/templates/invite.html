<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation Ouyaboung</title>
</head>
<body style="font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #1f2937; max-width: 600px; margin: 0 auto; padding: 20px; background: #f9fafb;">
  <div style="background: #0891b2; padding: 28px 20px; text-align: center; border-radius: 12px 12px 0 0;">
    <h1 style="margin: 0; color: #ffffff; font-size: 24px;">Vous êtes invité sur Ouyaboung</h1>
  </div>

  <div style="background: #ffffff; border: 1px solid #e5e7eb; border-top: none; border-radius: 0 0 12px 12px; padding: 30px;">
    <p style="margin-top: 0;">Bonjour,</p>
    <p>Un administrateur vous a invité à rejoindre Ouyaboung.</p>

    <div style="text-align: center; margin: 28px 0;">
      <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #0891b2; color: #ffffff; text-decoration: none; padding: 14px 24px; border-radius: 8px; font-weight: 600;">
        Accepter l'invitation
      </a>
    </div>

    <p style="margin-bottom: 0; font-size: 14px; color: #6b7280;">
      Si vous ne reconnaissez pas cette invitation, ignorez cet email.<br>
      Lien direct: <span style="word-break: break-all;">{{ .ConfirmationURL }}</span>
    </p>
  </div>
  <p style="font-size:14px;color:#64748b;">
À très bientôt,<br>
L’équipe <strong>Ouyaboung</strong><br>
Entreprise fondatrice : IFUMB
</p>
</body>
</html>
