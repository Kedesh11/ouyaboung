name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Unit Tests
        run: npm run test:unit

      - name: Coverage Thresholds
        run: npm run test:coverage

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Runs entirely against the local migrations (Docker Postgres via the
      # Supabase CLI) - no project secrets needed. Applying all migrations
      # from scratch on every PR also catches broken/non-idempotent SQL
      # before it reaches a real environment.
      - name: Start local Supabase stack
        run: supabase start

      - name: Check Database Types
        run: |
          supabase gen types typescript --local > src/types/supabase.ts
          git diff --exit-code -- src/types/supabase.ts

      - name: Type Checking
        run: npx tsc --noEmit

      - name: Build Project
        run: npm run build
        env:
          # If your build needs these to be set (even if dummy values for build time)
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"

      # End-to-end regression suite (Playwright) - real browser against the
      # local Supabase stack started above. playwright.config.ts builds and
      # starts its own `next start` server pointed at the local stack, so
      # this is independent of the placeholder build right above. See
      # docs/E2E_TESTING.md.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E regression suite
        run: npm run test:regression
